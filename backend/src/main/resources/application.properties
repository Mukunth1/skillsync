spring.application.name=skillsync-backend
server.port=${SERVER_PORT:8080}

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:skillsync}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-change-me-please-32+}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# --- Seed admin ---
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@skillsync.edu}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:Admin Overseer}

# --- Logging ---
logging.level.com.skillsync=INFO
logging.level.org.springframework.security=WARN
